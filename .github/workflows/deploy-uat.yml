# UAT deployment pipeline.
#
# Pushing to `uat` verifies the code, ships the backend to the Railway `uat`
# environment, waits for it to actually answer /health, and only then points
# uat.recruitr.in at the new frontend build. The ordering matters: the frontend
# is useless against a backend that failed to boot, so the health gate stands
# between the two deploys rather than after both.
name: Deploy UAT

on:
  push:
    branches: [uat]
  workflow_dispatch:

# Two overlapping deploys would race each other onto the same environment.
# Queue them instead of cancelling — a cancelled `railway up` still leaves a
# build running on Railway's side, so cancelling buys nothing and loses the logs.
concurrency:
  group: deploy-uat
  cancel-in-progress: false

env:
  UAT_API_URL: https://api.uat.recruitr.in
  UAT_APP_URL: https://uat.recruitr.in

jobs:
  # The full CI suite — ruff, pytest, eslint, prettier, tsc, next build — reused
  # rather than restated, so a check added to CI automatically gates UAT too.
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml

  backend:
    name: Deploy backend (Railway)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # RAILWAY_UAT_TOKEN is a project token scoped to the `uat` environment,
      # which is what makes this safe: it cannot reach production.
      #
      # --path-as-root uploads apps/backend as the archive root so the
      # Dockerfile's `COPY requirements.txt .` resolves. The service's own root
      # directory setting only applies to GitHub-sourced builds, not CLI uploads.
      # --ci streams build logs and exits once the build finishes.
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_UAT_TOKEN }}
        run: railway up ./apps/backend --path-as-root --service backend --environment uat --ci

      # `railway up --ci` returns when the *build* is done, not when the new
      # container is serving. Poll until it is, so a boot failure (bad env var,
      # unreachable Atlas cluster) fails here instead of surfacing as a broken
      # UAT site later.
      - name: Wait for backend health
        run: |
          for attempt in $(seq 1 30); do
            if body=$(curl -fsS --max-time 10 "$UAT_API_URL/health"); then
              status=$(printf '%s' "$body" | jq -r '.status')
              echo "attempt $attempt: $body"
              # "degraded" means index sync was skipped after a startup failure;
              # the API still serves every request, so it is a warning, not a
              # failed deploy. See app/main.py::health.
              if [ "$status" = "degraded" ]; then
                echo "::warning::Backend is healthy but degraded — indexes are not being synced. See /health for details."
                echo "⚠️ Backend **degraded**: \`$body\`" >> "$GITHUB_STEP_SUMMARY"
              fi
              echo "✅ Backend live at $UAT_API_URL (status: $status)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt $attempt: not ready yet"
            sleep 10
          done
          echo "::error::$UAT_API_URL/health did not return 200 within 5 minutes"
          exit 1

  frontend:
    name: Deploy frontend (Vercel)
    needs: backend
    runs-on: ubuntu-latest
    environment:
      name: uat
      url: https://uat.recruitr.in
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_UAT }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: |
          corepack enable
          npm install -g vercel@latest

      # `production` here is the *recruitr-uat* project's production target —
      # that is what binds the build to uat.recruitr.in instead of a throwaway
      # preview URL, and it sidesteps preview deployment protection.
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          {
            echo "✅ Frontend live at $UAT_APP_URL"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| App | $UAT_APP_URL |"
            echo "| API | $UAT_API_URL |"
            echo "| Deployment | $url |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
